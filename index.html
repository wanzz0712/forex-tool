<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Trading Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0b0f1a; color: #e5e7eb; font-family: sans-serif; }
        .input-card { background: #161b22; border: 1px solid #30363d; border-radius: 12px; }
        .result-card { background: #161b22; border: 1px solid #30363d; border-radius: 12px; }
        .section-title { color: #58a6ff; font-weight: bold; border-bottom: 1px solid #30363d; padding-bottom: 8px; margin-bottom: 16px; }
        input, select { background-color: #0d1117; border: 1px solid #30363d; border-radius: 6px; padding: 10px; width: 100%; color: #c9d1d9; font-size: 14px; }
        label { display: block; font-size: 12px; color: #8b949e; margin-bottom: 4px; font-weight: 600; }
        .btn-active { background-color: #1f6feb; border: 1px solid #58a6ff; color: white; }
        .btn-inactive { background-color: #21262d; border: 1px solid #30363d; color: #8b949e; }
        .suggestion-box { background-color: rgba(35, 134, 54, 0.1); border: 1px dashed #238636; padding: 8px; border-radius: 6px; margin-top: 6px; }
        #tv-chart-container { height: 600px; border-radius: 12px; overflow: hidden; border: 1px solid #30363d; background: #161b22; }
    </style>
</head>
<body class="py-6 px-4">

    <div class="max-w-[1600px] mx-auto grid grid-cols-1 lg:grid-cols-12 gap-6">
        
        <div class="lg:col-span-3 space-y-6">
            <div class="input-card p-6 shadow-2xl">
                <h2 class="section-title text-blue-400">1. 基本設定</h2>
                <div class="space-y-4">
                    <div>
                        <label>交易商品</label>
                        <select id="symbol" onchange="updateChart(); calculateAll();">
                            <option value="XAUUSD">黃金 (GOLD/XAUUSD)</option>
                            <option value="EURUSD">歐美 (EURUSD)</option>
                            <option value="GBPUSD">鎊美 (GBPUSD)</option>
                            <option value="BTCUSD">比特幣 (BTCUSD)</option>
                        </select>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div><label>帳戶餘額 (USD)</label><input type="number" id="balance" value="2000" oninput="calculateAll()"></div>
                        <div><label>槓桿 (1:X)</label><input type="number" id="leverage" value="500" oninput="calculateAll()"></div>
                    </div>
                    <div><label>單筆風險 (%)</label><input type="number" id="riskPct" value="1" oninput="calculateAll()"></div>
                </div>

                <h2 class="section-title text-blue-400 mt-8">2. 交易計劃</h2>
                <div class="space-y-4">
                    <div class="flex gap-2">
                        <button id="btnBuy" onclick="setDirection('buy')" class="flex-1 py-2 rounded btn-active font-bold">做多 BUY</button>
                        <button id="btnSell" onclick="setDirection('sell')" class="flex-1 py-2 rounded btn-inactive font-bold">做空 SELL</button>
                    </div>
                    <div><label>進場價格</label><input type="number" id="entryPrice" value="2650" step="0.01" oninput="calculateAll()"></div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="text-red-400">止損 (SL)</label>
                            <input type="number" id="stopLoss" value="2645" step="0.01" oninput="calculateAll()">
                            <div class="suggestion-box"><p id="suggestSL" class="text-[10px] font-mono text-green-400 font-bold"></p></div>
                        </div>
                        <div>
                            <label class="text-blue-400">止盈 (TP)</label>
                            <input type="number" id="takeProfit" value="2660" step="0.01" oninput="calculateAll()">
                            <div class="suggestion-box"><p id="suggestTP" class="text-[10px] font-mono text-green-400 font-bold"></p></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="lg:col-span-6">
            <div id="tv-chart-container">
                <div id="tradingview_chart" style="height: 100%; width: 100%;"></div>
            </div>
        </div>

        <div class="lg:col-span-3 space-y-4">
            <div class="bg-orange-500 text-white p-6 rounded-xl text-center shadow-xl border-b-4 border-orange-700">
                <p class="text-xs uppercase font-bold opacity-90">建議開倉手數 (LOTS)</p>
                <h3 id="resLots" class="text-5xl font-black my-2">0.10</h3>
                <p id="resRiskDesc" class="text-[10px] italic opacity-80 font-bold">根據風險管理自動計算</p>
            </div>

            <div class="result-card p-6 space-y-4 shadow-2xl">
                <h2 class="text-blue-400 font-bold border-b border-gray-800 pb-2 uppercase tracking-widest text-sm">數據分析 Results</h2>
                <div class="flex justify-between border-b border-gray-800 pb-2">
                    <span class="text-gray-400 text-xs">盈虧比 (R:R)</span>
                    <span id="resRR" class="text-blue-400 font-bold">1:2.00</span>
                </div>
                <div class="flex justify-between border-b border-gray-800 pb-2">
                    <span class="text-gray-400 text-xs">預計虧損 (Loss)</span>
                    <span id="resLossMoney" class="text-red-400 font-bold">$20.00</span>
                </div>
                <div class="flex justify-between border-b border-gray-800 pb-2">
                    <span class="text-gray-400 text-xs">預計獲利 (Profit)</span>
                    <span id="resProfitMoney" class="text-green-400 font-bold">$40.00</span>
                </div>
                <div class="flex justify-between border-b border-gray-800 pb-2">
                    <span class="text-gray-400 text-xs">佔用保證金</span>
                    <span id="resMargin" class="text-gray-200 font-bold">$53.00</span>
                </div>
                <div class="flex justify-between">
                    <span class="text-gray-400 text-xs">保證金比例</span>
                    <span id="resMarginLevel" class="text-green-500 font-bold">3774%</span>
                </div>

                <div class="bg-black/50 border border-yellow-500/20 p-4 rounded-lg text-center mt-6">
                    <p class="text-[10px] text-yellow-500/70 uppercase tracking-widest mb-1">強制平倉估價 (LIQ)</p>
                    <p id="resLiqPrice" class="text-2xl font-bold font-mono text-yellow-500">$2500.00</p>
                    <p class="text-[8px] text-gray-500 mt-1 uppercase italic">當淨值虧損達 75% 時</p>
                </div>
            </div>
        </div>

    </div>

    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <script>
        let direction = 'buy';

        function initChart(symbol = 'OANDA:XAUUSD') {
            new TradingView.widget({
                "autosize": true,
                "symbol": symbol,
                "interval": "H1",
                "timezone": "Etc/UTC",
                "theme": "dark",
                "style": "1",
                "locale": "zh_TW",
                "toolbar_bg": "#f1f3f6",
                "enable_publishing": false,
                "hide_side_toolbar": false,
                "allow_symbol_change": true,
                "container_id": "tradingview_chart"
            });
        }

        function updateChart() {
            const sym = document.getElementById('symbol').value;
            let tvSym = 'OANDA:XAUUSD';
            if(sym === 'EURUSD') tvSym = 'FX_IDC:EURUSD';
            if(sym === 'GBPUSD') tvSym = 'FX_IDC:GBPUSD';
            if(sym === 'BTCUSD') tvSym = 'BINANCE:BTCUSDT';
            initChart(tvSym);
        }

        function setDirection(d) {
            direction = d;
            document.getElementById('btnBuy').className = d === 'buy' ? 'flex-1 py-2 rounded btn-active font-bold' : 'flex-1 py-2 rounded btn-inactive font-bold';
            document.getElementById('btnSell').className = d === 'sell' ? 'flex-1 py-2 rounded btn-active font-bold' : 'flex-1 py-2 rounded btn-inactive font-bold';
            calculateAll();
        }

        function calculateAll() {
            const sym = document.getElementById('symbol').value;
            const balance = parseFloat(document.getElementById('balance').value) || 0;
            const riskPct = parseFloat(document.getElementById('riskPct').value) || 0;
            const entry = parseFloat(document.getElementById('entryPrice').value) || 0;
            const sl = parseFloat(document.getElementById('stopLoss').value) || 0;
            const tp = parseFloat(document.getElementById('takeProfit').value) || 0;
            const lev = parseFloat(document.getElementById('leverage').value) || 1;
            
            // 自動合約規格 (後台判斷)
            let size = 100000;
            if(sym === 'XAUUSD') size = 100;
            if(sym === 'BTCUSD') size = 1;

            const riskAmt = balance * (riskPct / 100);

            // 建議值邏輯
            const defaultSlDist = sym === 'XAUUSD' ? 5 : 0.005; 
            const sSL = direction === 'buy' ? entry - defaultSlDist : entry + defaultSlDist;
            const sTP = direction === 'buy' ? entry + (defaultSlDist * 2) : entry - (defaultSlDist * 2);
            document.getElementById('suggestSL').innerText = "建議 SL: " + sSL.toFixed(2);
            document.getElementById('suggestTP').innerText = "建議 TP: " + sTP.toFixed(2);

            // 計算手數
            const slDist = Math.abs(entry - sl);
            let lots = slDist > 0 ? riskAmt / (slDist * size) : 0;
            const tpDist = Math.abs(tp - entry);
            const profitAmt = lots * tpDist * size;
            const rr = slDist > 0 ? (tpDist / slDist).toFixed(2) : 0;
            const margin = (entry * size * lots) / lev;
            const marginLevel = margin > 0 ? (balance / margin) * 100 : 0;
            const liqDist = lots > 0 ? (balance * 0.75) / (lots * size) : 0;
            const liqPrice = direction === 'buy' ? entry - liqDist : entry + liqDist;

            // UI 更新
            document.getElementById('resLots').innerText = lots.toFixed(2);
            document.getElementById('resLossMoney').innerText = `$${riskAmt.toFixed(2)}`;
            document.getElementById('resProfitMoney').innerText = `$${profitAmt.toFixed(2)}`;
            document.getElementById('resRR').innerText = `1 : ${rr}`;
            document.getElementById('resMargin').innerText = `$${margin.toFixed(2)}`;
            document.getElementById('resMarginLevel').innerText = `${marginLevel.toFixed(0)}%`;
            document.getElementById('resLiqPrice').innerText = `$${liqPrice.toFixed(2)}`;
        }

        // 初始化
        window.onload = () => {
            initChart();
            calculateAll();
        };
    </script>
</body>
</html>
