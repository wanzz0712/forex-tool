<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>專業交易風控 - Live Chart 版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0b0f1a; color: #e5e7eb; font-family: sans-serif; }
        .input-card { background: #161b22; border: 1px solid #30363d; border-radius: 12px; }
        .result-card { background: #161b22; border: 1px solid #30363d; border-radius: 12px; }
        .section-title { color: #58a6ff; font-weight: bold; border-bottom: 1px solid #30363d; padding-bottom: 8px; margin-bottom: 16px; }
        input, select { background-color: #0d1117; border: 1px solid #30363d; border-radius: 6px; padding: 10px; width: 100%; color: #c9d1d9; }
        label { display: block; font-size: 12px; color: #8b949e; margin-bottom: 4px; font-weight: 600; }
        .btn-active { background-color: #1f6feb; border: 1px solid #58a6ff; color: white; }
        .btn-inactive { background-color: #21262d; border: 1px solid #30363d; color: #8b949e; }
        .suggestion-box { background-color: rgba(35, 134, 54, 0.1); border: 1px dashed #238636; padding: 8px; border-radius: 6px; margin-top: 6px; }
        /* 圖表容器高度 */
        #tv-chart-container { height: 500px; border-radius: 12px; overflow: hidden; border: 1px solid #30363d; }
    </style>
</head>
<body class="py-6 px-4">

    <div class="max-w-[1400px] mx-auto grid grid-cols-1 xl:grid-cols-3 gap-6">
        
        <div class="input-card p-6 shadow-2xl">
            <h2 class="section-title">1. 設定與計劃</h2>
            <div class="grid grid-cols-2 gap-4 mb-4">
                <div class="col-span-2">
                    <label>交易商品</label>
                    <select id="symbol" onchange="updateChart(); calculateAll();">
                        <option value="XAUUSD">黃金 (XAUUSD)</option>
                        <option value="EURUSD">歐美 (EURUSD)</option>
                        <option value="GBPUSD">鎊美 (GBPUSD)</option>
                    </select>
                </div>
                <div><label>帳戶餘額 (USD)</label><input type="number" id="balance" value="2000" oninput="calculateAll()"></div>
                <div><label>槓桿 (1:X)</label><input type="number" id="leverage" value="500" oninput="calculateAll()"></div>
                <div class="col-span-2"><label>單筆風險 (%)</label><input type="number" id="riskPct" value="1" oninput="calculateAll()"></div>
            </div>

            <div class="grid grid-cols-2 gap-4 mb-4 pt-4 border-t border-gray-800">
                <div class="col-span-2 flex gap-2">
                    <button id="btnBuy" onclick="setDirection('buy')" class="flex-1 py-2 rounded btn-active font-bold text-sm">做多 BUY</button>
                    <button id="btnSell" onclick="setDirection('sell')" class="flex-1 py-2 rounded btn-inactive font-bold text-sm">做空 SELL</button>
                </div>
                <div class="col-span-2"><label>進場價格</label><input type="number" id="entryPrice" value="2300" step="0.01" oninput="calculateAll()"></div>
                <div>
                    <label class="text-red-400">止損 SL</label>
                    <input type="number" id="stopLoss" value="2298" step="0.01" oninput="calculateAll()">
                    <div class="suggestion-box"><p id="suggestSL" class="text-xs font-mono text-green-100">--</p></div>
                </div>
                <div>
                    <label class="text-blue-400">止盈 TP</label>
                    <input type="number" id="takeProfit" value="2304" step="0.01" oninput="calculateAll()">
                    <div class="suggestion-box"><p id="suggestTP" class="text-xs font-mono text-green-100">--</p></div>
                </div>
            </div>
            <button onclick="calculateAll()" class="w-full bg-blue-600 py-3 rounded-lg font-bold">更新計算</button>
        </div>

        <div class="xl:col-span-1 space-y-4">
            <div id="tv-chart-container">
                <div class="tradingview-widget-container" style="height:100%;width:100%">
                    <div id="tradingview_chart" style="height:100%;width:100%"></div>
                </div>
                </div>
            
            <div class="bg-orange-500 p-4 rounded-xl text-center shadow-lg">
                <p class="text-[10px] font-bold uppercase">建議開倉手數</p>
                <h3 id="resLots" class="text-4xl font-black">0.10</h3>
            </div>
        </div>

        <div class="result-card p-6 space-y-4 shadow-2xl">
            <h2 class="text-blue-400 font-bold border-b border-gray-800 pb-2">計算細節</h2>
            <div class="flex justify-between"><span>盈虧比</span><span id="resRR" class="text-blue-400 font-bold">1:2.00</span></div>
            <div class="flex justify-between"><span>預計虧損</span><span id="resLossMoney" class="text-red-400 font-bold">$20.00</span></div>
            <div class="flex justify-between"><span>預計獲利</span><span id="resProfitMoney" class="text-blue-400 font-bold">$40.00</span></div>
            <div class="flex justify-between"><span>佔用保證金</span><span id="resMargin" class="font-bold">$46.00</span></div>
            <div class="flex justify-between"><span>保證金比例</span><span id="resMarginLevel" class="text-green-400 font-bold">4347%</span></div>
            
            <div class="bg-black/40 border border-yellow-500/30 p-4 rounded-lg text-center mt-4">
                <p class="text-[10px] text-yellow-500 uppercase tracking-widest">爆倉參考價</p>
                <p id="resLiqPrice" class="text-xl font-bold font-mono text-yellow-500">$2250.00</p>
            </div>
        </div>

    </div>

    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <script>
        let direction = 'buy';
        let tvWidget = null;

        function initChart(symbol = 'OANDA:XAUUSD') {
            tvWidget = new TradingView.widget({
                "autosize": true,
                "symbol": symbol,
                "interval": "H1",
                "timezone": "Etc/UTC",
                "theme": "dark",
                "style": "1",
                "locale": "zh_TW",
                "toolbar_bg": "#f1f3f6",
                "enable_publishing": false,
                "hide_top_toolbar": false,
                "save_image": false,
                "container_id": "tradingview_chart"
            });
        }

        function updateChart() {
            const sym = document.getElementById('symbol').value;
            const tvSym = sym === 'XAUUSD' ? 'OANDA:XAUUSD' : `FX_IDC:${sym}`;
            initChart(tvSym);
        }

        function setDirection(d) {
            direction = d;
            document.getElementById('btnBuy').className = d === 'buy' ? 'flex-1 py-2 rounded btn-active font-bold' : 'flex-1 py-2 rounded btn-inactive font-bold';
            document.getElementById('btnSell').className = d === 'sell' ? 'flex-1 py-2 rounded btn-active font-bold' : 'flex-1 py-2 rounded btn-inactive font-bold';
            calculateAll();
        }

        function calculateAll() {
            const sym = document.getElementById('symbol').value;
            const balance = parseFloat(document.getElementById('balance').value) || 0;
            const riskPct = parseFloat(document.getElementById('riskPct').value) || 0;
            const entry = parseFloat(document.getElementById('entryPrice').value) || 0;
            const sl = parseFloat(document.getElementById('stopLoss').value) || 0;
            const tp = parseFloat(document.getElementById('takeProfit').value) || 0;
            const lev = parseFloat(document.getElementById('leverage').value) || 1;
            const size = sym === 'XAUUSD' ? 100 : 100000;
            const riskAmt = balance * (riskPct / 100);

            // 建議值邏輯
            const defaultSlDist = sym === 'XAUUSD' ? 2 : 0.002; 
            const suggestSL = direction === 'buy' ? entry - defaultSlDist : entry + defaultSlDist;
            const suggestTP = direction === 'buy' ? entry + (defaultSlDist * 2) : entry - (defaultSlDist * 2);
            document.getElementById('suggestSL').innerText = "建議: " + suggestSL.toFixed(2);
            document.getElementById('suggestTP').innerText = "建議: " + suggestTP.toFixed(2);

            // 計算
            const slDist = Math.abs(entry - sl);
            let lots = slDist > 0 ? riskAmt / (slDist * size) : 0;
            const tpDist = Math.abs(tp - entry);
            const profitAmt = lots * tpDist * size;
            const rr = slDist > 0 ? (tpDist / slDist).toFixed(2) : 0;
            const margin = (entry * size * lots) / lev;
            const marginLevel = margin > 0 ? (balance / margin) * 100 : 0;
            const liqDist = lots > 0 ? (balance * 0.75) / (lots * size) : 0;
            const liqPrice = direction === 'buy' ? entry - liqDist : entry + liqDist;

            // UI
            document.getElementById('resLots').innerText = lots.toFixed(2);
            document.getElementById('resLossMoney').innerText = `$${riskAmt.toFixed(2)}`;
            document.getElementById('resProfitMoney').innerText = `$${profitAmt.toFixed(2)}`;
            document.getElementById('resRR').innerText = `1 : ${rr}`;
            document.getElementById('resMargin').innerText = `$${margin.toFixed(2)}`;
            document.getElementById('resMarginLevel').innerText = `${marginLevel.toFixed(0)}%`;
            document.getElementById('resLiqPrice').innerText = `$${liqPrice.toFixed(2)}`;
        }

        window.onload = () => {
            initChart();
            calculateAll();
        };
    </script>
</body>
</html>
